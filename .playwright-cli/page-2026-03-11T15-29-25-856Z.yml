      - paragraph [ref=e301]: "We use a vector database to find documents, and before giving them to the large language model (LLM), we can take one or both actions:"
      - list [ref=e302]:
        - listitem [ref=e303]: Tell the LLM to remove documents that are not relevant
        - listitem [ref=e304]: Only retrieve the most similar documents by filtering the relevance score
      - heading "Rewrite, retrieve and read" [level=2] [ref=e305]
      - generic [ref=e306]: "flowchart LR Q[Original Query] --> R[LLM Rewriter] R --> E[Enhanced Query] E --> S[Vector Search] S --> M[Retrieved Docs] M --> L[LLM Response] L --> G{Q Satisfied?} G -->|No| R G -->|Yes| F[Final Answer] style E fill:#e8d5f0,stroke:#b43278 style G fill:#f0dce6,stroke:#b43278"
      - paragraph [ref=e307]: Basically in this approach, we ask the LLM to rewrite the user query, it will generate better results since the LLM is so good at understanding purposes and meanings
      - heading "Retrieval with reranking" [level=2] [ref=e308]
      - generic [ref=e309]: flowchart TD Q[User Query] --> I[Initial Search] I -->|"n=50 docs"| R[Reranker LLM] R --> S[Scoring] S --> T[Top-K Selection] T -->|"k=5"| C[Filtered Context] C --> L[LLM Response] subgraph Scoring Process R --> S S --> T end style T fill:#e8d5f0,stroke:#b43278 style C fill:#dde0f5,stroke:#b43278
      - paragraph [ref=e310]: Pass a bigger number of documents to the Reranker, which is an LLM that takes the query and the documents and returns a relevance score to filter out documents
      - heading "Parent document retrieval" [level=2] [ref=e311]
      - generic [ref=e312]: flowchart TD Q[User Query] --> S[Vector Search] S -->|"Chunk 5 Match"| C[Identify Related Chunks] C -->|"Chunk 4,5,6"| R[Reconstruct Parent Doc] R --> Ctx[Full Context] Ctx --> L[LLM Response] subgraph Chunk Management P[Parent Document] C1[Chunk 1] C2[Chunk 2] C3[Chunk 3] C4[Chunk 4] C5[Chunk 5] C6[Chunk 6] P --> C1 P --> C2 P --> C3 P --> C4 P --> C5 P --> C6 end style R fill:#e8d5f0,stroke:#b43278 style Ctx fill:#dde0f5,stroke:#b43278
      - paragraph [ref=e313]: Fix the issue when your query is in the middle of 2 chunks of documents stored in the vector db. In this case, we combine multiple contiguous chunks related to the most relevant chunk to give the LLM full context to answer the query, it will depend on how we are splitting our chunks.
