    - article [ref=e46]:
      - paragraph [ref=e47]: In this article, we explore effective strategies for integrating vector databases with large language models (LLMs). Learn about the latest techniques in similarity search, contextual compression, and more, to enhance how your systems process and retrieve documents for relevant answers. This small guide is ideal for developers and technologists looking to update your AI applications.
      - heading "Strategy overview" [level=2] [ref=e48]
      - generic [ref=e49]: "flowchart TD A[User Query] --> B{Choose Strategy} B -->|Simple Docs| C[Vector Search] B -->|Filter Noise| D[Contextual Compression] B -->|Complex Query| E[Rewrite-Retrieve-Read] B -->|Max Accuracy| F[\"Retrieval + Reranking\"] B -->|Chunk Boundaries| G[Parent Document] C --> H[Vector DB Search] D --> I[\"Filter + Score\"] E --> J[LLM Query Enhancement] F --> K[Scored Ranking] G --> L[Chunk Reconstruction] H --> M[LLM Response] I --> M J --> M K --> M L --> M style C fill:#3d1f4e,color:#e6dceb style D fill:#5c2a6e,color:#e6dceb style E fill:#4a2040,color:#e6dceb style F fill:#6b2250,color:#e6dceb style G fill:#2d1f3d,color:#e6dceb"
      - heading "Vector search" [level=2] [ref=e50]
      - paragraph [ref=e51]: This is the nave approach where we use a method called similarity search to retrieve documents from a vector database. Once we have obtained the documents, we feed them into a large language model (LLM) to produce results
      - heading "Issues" [level=3] [ref=e52]
      - list [ref=e53]:
        - listitem [ref=e54]: Large doc chunks reduce the quality of the retrieval process
        - listitem [ref=e55]: Limited context relevance
        - listitem [ref=e56]: Bad retrievals or return irrelevant chunks
      - heading "Contextual compression" [level=2] [ref=e57]
      - generic [ref=e58]: flowchart TD Q[User Query] --> V[Vector DB] V -->|Raw Documents| F[Filter] V -->|"n=20 docs"| F F -->|Score Filter| R[Relevant Only] F -->|LLM Filter| R R --> C[Compressed Context] C --> LLM[LLM Input] LLM --> A[Response] subgraph Filtering Options F1[Relevance Score Threshold] F2[LLM Relevance Assessment] end F --> F1 F --> F2 style R fill:#4a2040,color:#e6dceb style C fill:#3d1f4e,color:#e6dceb
      - paragraph [ref=e59]: "We use a vector database to find documents, and before giving them to the large language model (LLM), we can take one or both actions:"
      - list [ref=e60]:
        - listitem [ref=e61]: Tell the LLM to remove documents that are not relevant
        - listitem [ref=e62]: Only retrieve the most similar documents by filtering the relevance score
      - heading "Rewrite, retrieve and read" [level=2] [ref=e63]
      - generic [ref=e64]: "flowchart LR Q[Original Query] --> R[LLM Rewriter] R --> E[Enhanced Query] E --> S[Vector Search] S --> M[Retrieved Docs] M --> L[LLM Response] L --> G{Q Satisfied?} G -->|No| R G -->|Yes| F[Final Answer] style E fill:#4a2040,color:#e6dceb style G fill:#5c2a6e,color:#e6dceb"
      - paragraph [ref=e65]: Basically in this approach, we ask the LLM to rewrite the user query, it will generate better results since the LLM is so good at understanding purposes and meanings
      - heading "Retrieval with reranking" [level=2] [ref=e66]
      - generic [ref=e67]: flowchart TD Q[User Query] --> I[Initial Search] I -->|"n=50 docs"| R[Reranker LLM] R --> S[Scoring] S --> T[Top-K Selection] T -->|"k=5"| C[Filtered Context] C --> L[LLM Response] subgraph Scoring Process R --> S S --> T end style T fill:#4a2040,color:#e6dceb style C fill:#3d1f4e,color:#e6dceb
      - paragraph [ref=e68]: Pass a bigger number of documents to the Reranker, which is an LLM that takes the query and the documents and returns a relevance score to filter out documents
      - heading "Parent document retrieval" [level=2] [ref=e69]
      - generic [ref=e70]: flowchart TD Q[User Query] --> S[Vector Search] S -->|"Chunk 5 Match"| C[Identify Related Chunks] C -->|"Chunk 4,5,6"| R[Reconstruct Parent Doc] R --> Ctx[Full Context] Ctx --> L[LLM Response] subgraph Chunk Management P[Parent Document] C1[Chunk 1] C2[Chunk 2] C3[Chunk 3] C4[Chunk 4] C5[Chunk 5] C6[Chunk 6] P --> C1 P --> C2 P --> C3 P --> C4 P --> C5 P --> C6 end style R fill:#4a2040,color:#e6dceb style Ctx fill:#3d1f4e,color:#e6dceb
      - paragraph [ref=e71]: Fix the issue when your query is in the middle of 2 chunks of documents stored in the vector db. In this case, we combine multiple contiguous chunks related to the most relevant chunk to give the LLM full context to answer the query, it will depend on how we are splitting our chunks.
      - heading "Strategy selection guide" [level=2] [ref=e72]
      - generic [ref=e73]: "flowchart TD Start([Start]) --> Q1{Simple Query?} Q1 -->|Yes| Q2{Small Docs?} Q1 -->|No| Q3{High Accuracy?} Q2 -->|Yes| VS[Vector Search] Q2 -->|No| Q4{Chunk Issues?} Q3 -->|Yes| RR[Reranking] Q3 -->|No| Q5{Complex Query?} Q4 -->|Yes| PDR[Parent Document] Q4 -->|No| CC[Contextual Compression] Q5 -->|Yes| RRR[Rewrite-Retrieve-Read] Q5 -->|No| CC VS --> End([Recommended]) CC --> End RRR --> End RR --> End PDR --> End style VS fill:#3d1f4e,color:#e6dceb style CC fill:#5c2a6e,color:#e6dceb style RRR fill:#4a2040,color:#e6dceb style RR fill:#6b2250,color:#e6dceb style PDR fill:#2d1f3d,color:#e6dceb"
