<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b4d8"/>
      <stop offset="100%" stop-color="#b4c8e8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Monitor body -->
  <rect x="6" y="5" width="20" height="15" rx="2" fill="#44315C"/>
  <!-- Screen -->
  <rect x="8" y="7" width="16" height="11" rx="1" fill="#5c3d7a"/>
  <!-- Terminal chevron > (pixel art style) -->
  <path d="M10 10 L13 12.5 L10 15" fill="none" stroke="#c9b0e0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor block _ -->
  <rect x="15" y="14" width="4" height="1.5" rx="0.5" fill="#c9b0e0"/>
  <!-- Monitor stand -->
  <rect x="13" y="20" width="6" height="2" fill="#44315C"/>
  <!-- Monitor base -->
  <rect x="11" y="22" width="10" height="2" rx="1" fill="#44315C"/>
  <!-- Corner pixel dots like OG image -->
  <circle cx="3" cy="3" r="1" fill="#6b4d8a" opacity="0.5"/>
  <circle cx="5" cy="3" r="1" fill="#6b4d8a" opacity="0.5"/>
  <circle cx="3" cy="5" r="1" fill="#6b4d8a" opacity="0.5"/>
  <circle cx="29" cy="29" r="1" fill="#6b4d8a" opacity="0.5"/>
  <circle cx="27" cy="29" r="1" fill="#6b4d8a" opacity="0.5"/>
  <circle cx="29" cy="27" r="1" fill="#6b4d8a" opacity="0.5"/>
</svg>
